<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pàgina no trobada · Hyperion Rockets</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Self-contained on purpose: GitHub Pages serves this file at any broken address, so it uses no relative files. */
:root{color-scheme:dark;--bg:#0A1631;--ink:#F1F3F6;--hull:#DFE2E4;--mute:#A9B5D1;--rule:#22365F;--coral:#D65A5A;--btn:#C43E2E;--btn-hi:#D44A38;--flare:#D84A36;--core:#FFE3C4;--port:#3499BD;--outline:#060D1C;--ease:cubic-bezier(.16,.84,.24,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 70% 0%,rgba(52,153,189,.14),transparent 70%),var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;padding:24px 16px}
.stars,.stars::after{position:fixed;inset:-50%;pointer-events:none;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(1.4px 1.4px at 200px 160px,#FFE3C4,transparent),radial-gradient(1px 1px at 60px 190px,#fff,transparent),radial-gradient(1px 1px at 260px 40px,#fff,transparent);background-size:300px 220px;opacity:.55;animation:drift 90s linear infinite}
.stars::after{content:"";inset:0;background-size:180px 140px;opacity:.5;animation-duration:60s}
@keyframes drift{to{transform:translate(-300px,-220px)}}
main{position:relative;text-align:center;max-width:640px}
.code{display:flex;align-items:center;justify-content:center;gap:.04em;font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:125%;font-weight:800;font-size:clamp(5rem,22vw,10rem);line-height:1;letter-spacing:.02em}
.code span{display:inline-block;animation:in .9s var(--ease) both}
.code span:last-child{animation-delay:.15s}
.orb{position:relative;display:inline-grid;place-items:center;width:.82em;height:.82em;margin-inline:.04em;border-radius:50%;box-shadow:inset 0 0 0 .07em var(--coral);animation:in .9s .08s var(--ease) both}
.orb svg{position:absolute;width:.62em;height:.62em;animation:tumble 7s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translate(0,0)}50%{transform:rotate(180deg) translate(.02em,-.03em)}100%{transform:rotate(360deg) translate(0,0)}}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:118%;font-weight:750;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1.3rem,4vw,1.9rem);margin:1.2rem 0 .6rem;text-wrap:balance;animation:in .8s .3s var(--ease) both}
p{margin:0 auto;max-width:46ch;color:var(--hull);line-height:1.6;animation:in .8s .4s var(--ease) both}
p.en{color:var(--mute);margin-top:.4rem;font-size:.95rem;animation-delay:.5s}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:2rem;animation:in .8s .6s var(--ease) both}
.btn{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:112%;font-weight:700;font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;padding:.9rem 1.35rem;border-radius:999px;color:#fff;background:var(--btn);transition:transform .35s var(--ease),background .25s,box-shadow .35s var(--ease)}
.btn:hover{background:var(--btn-hi);transform:translateY(-3px);box-shadow:0 14px 28px -12px rgba(216,74,54,.7)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(223,226,228,.55)}
.btn.ghost:hover{background:rgba(223,226,228,.08)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
:focus-visible{outline:2px solid #5DB6D6;outline-offset:3px}
::selection{background:var(--coral);color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<!-- visit counter (GoatCounter). Full https:// address: a bare "//" breaks local file:// testing -->
<script data-goatcounter="https://hyperionrockets.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <div class="code" aria-label="404">
    <span aria-hidden="true">4</span>
    <span class="orb" aria-hidden="true">
      <svg viewBox="0 0 40 100">
        <path d="M20 2 C29 14 31 28 31 42 L31 74 L9 74 L9 42 C9 28 11 14 20 2 Z" fill="#DFE2E4" stroke="#060D1C" stroke-width="2.5"/>
        <path d="M20 2 C25 9 27.5 15 28.6 21 L11.4 21 C12.5 15 15 9 20 2 Z" fill="#D65A5A" stroke="#060D1C" stroke-width="2.5"/>
        <circle cx="20" cy="38" r="5" fill="#3499BD" stroke="#060D1C" stroke-width="2.5"/>
        <path d="M9 56 L1 70 L1 82 L9 76 Z M31 56 L39 70 L39 82 L31 76 Z" fill="#D65A5A" stroke="#060D1C" stroke-width="2.5"/>
        <path d="M13 76 C13 86 17 92 20 98 C23 92 27 86 27 76 Z" fill="#D84A36"/>
        <path d="M16 76 C16 83 18 87 20 91 C22 87 24 83 24 76 Z" fill="#FFE3C4"/>
      </svg>
    </span>
    <span aria-hidden="true">4</span>
  </div>
  <h1>Aquesta pàgina s'ha perdut en òrbita</h1>
  <p>L'adreça no existeix o ha canviat. Torna a l'inici i continua des d'allà.</p>
  <p class="en" lang="en">This page drifted off into orbit. Head back to the home page.</p>
  <div class="actions">
    <a class="btn" id="home-ca" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8H3M7 4 3 8l4 4"/></svg>Torna a l'inici</a>
    <a class="btn ghost" id="home-en" href="/en/" lang="en">English home</a>
  </div>
</main>
<script>
/* Finds the home page wherever the site lives:
   local files, the domain root, or a sub-folder like /repo-name/ on GitHub Pages. */
(function(){
  var ca = document.getElementById("home-ca"), en = document.getElementById("home-en");
  var set = function(root){ ca.href = root + "index.html"; en.href = root + "en/index.html"; };

  if (location.protocol === "file:"){
    set(new URL(".", location.href).href);   // 404.html sits next to index.html
    return;
  }
  var first = location.pathname.split("/")[1];
  var tries = (first ? ["/" + first + "/"] : []).concat(["/"]);
  (function next(i){
    if (i >= tries.length) return;            // keep the default "/" links
    fetch(tries[i] + "coets.html", {method: "HEAD"}).then(function(r){
      if (r.ok) set(tries[i]); else next(i + 1);
    }, function(){ next(i + 1); });
  })(0);
})();
</script>
</body>
</html>
